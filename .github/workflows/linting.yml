name: Lint USVFS

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check format
        uses: ModOrganizer2/check-formatting-action@master
        with:
          check-path: "."
          # Preserve the imported mods shim byte-for-byte during extraction.
          exclude-regex: 'third-party|rust/usvfs-sys/native/barrier\.(cpp|h)$'
